<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Razieh Moradi, AI and LLM Security researcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#121a2b"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.75"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#8b9bb4" fill-opacity="0.13"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <ellipse cx="880" cy="160" rx="330" ry="210" fill="url(#glow)"/>

  <!-- layered network motif -->
  <g stroke="url(#edgeFade)" fill="none" stroke-width="1.1">
    <path d="M700 90 L810 60 M700 90 L810 130 M700 90 L810 200 M700 160 L810 60 M700 160 L810 130 M700 160 L810 200 M700 230 L810 130 M700 230 L810 200 M700 230 L810 265"/>
    <path d="M810 60 L930 95 M810 60 L930 165 M810 130 L930 95 M810 130 L930 165 M810 130 L930 235 M810 200 L930 165 M810 200 L930 235 M810 265 L930 235"/>
    <path d="M930 95 L1055 130 M930 95 L1055 195 M930 165 L1055 130 M930 165 L1055 195 M930 235 L1055 195"/>
  </g>

  <g filter="url(#soft)" opacity="0.65">
    <circle cx="810" cy="130" r="7" fill="#818cf8"/>
    <circle cx="930" cy="165" r="7" fill="#22d3ee"/>
    <circle cx="1055" cy="130" r="7" fill="#c084fc"/>
  </g>

  <g fill="#0d1117" stroke="url(#accent)" stroke-width="1.7">
    <circle cx="700" cy="90" r="5.5"/><circle cx="700" cy="160" r="5.5"/><circle cx="700" cy="230" r="5.5"/>
    <circle cx="810" cy="60" r="5.5"/><circle cx="810" cy="130" r="6.5"/><circle cx="810" cy="200" r="5.5"/><circle cx="810" cy="265" r="5.5"/>
    <circle cx="930" cy="95" r="5.5"/><circle cx="930" cy="165" r="6.5"/><circle cx="930" cy="235" r="5.5"/>
    <circle cx="1055" cy="130" r="6.5"/><circle cx="1055" cy="195" r="5.5"/>
  </g>

  <!-- left type block -->
  <rect x="72" y="86" width="3" height="148" fill="url(#accent)" rx="1.5"/>

  <text x="104" y="104" font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="3.4" fill="#22d3ee">AI &amp; LLM SECURITY</text>

  <text x="102" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="600" fill="#f0f6fc" letter-spacing="-0.6">Razieh Moradi</text>

  <text x="104" y="205" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#9aa8bd">Adversarial machine learning · statistical evaluation</text>

  <text x="104" y="232" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#6b7a90">Cyber Science Lab · University of Guelph</text>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="0.8">
    <rect x="104" y="252" width="127" height="26" rx="13" fill="none" stroke="#2b3647"/>
    <text x="118" y="269" fill="#8b9bb4">jailbreak eval</text>
    <rect x="241" y="252" width="120" height="26" rx="13" fill="none" stroke="#2b3647"/>
    <text x="255" y="269" fill="#8b9bb4">RAG poisoning</text>
    <rect x="371" y="252" width="142" height="26" rx="13" fill="none" stroke="#2b3647"/>
    <text x="385" y="269" fill="#8b9bb4">backdoor defense</text>
  </g>

  <rect x="0" y="317" width="1200" height="3" fill="url(#accent)"/>
</svg>
